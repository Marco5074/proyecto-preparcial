<h1>Pre-parcial por casos</h1>
<p class="sub">40 preguntas: 30 de selección múltiple (20 de teoría y 10 casos) y 10 escritas de análisis. Al final obtienes un diagnóstico de tus puntos débiles por tema.</p>

["P","Reporte de ventas lento. <code>SELECT</code> de 9 columnas con <code>WHERE vendedor_id = 12</code>. Plan: Index Seek 8 % y Key Lookup 92 % con 4 500 ejecuciones. En 3 a 5 líneas: diagnostique, proponga el índice y diga qué mediría después.","El Seek encuentra las filas, pero faltan columnas y hay 4 500 viajes a la tabla base. Propongo <code>(vendedor_id) INCLUDE (columnas del SELECT)</code>. Después mediría que desaparezca el Key Lookup, las lecturas lógicas antes/después y las filas leídas.",["Identifica el Key Lookup como causa","Propone INCLUDE con las columnas del SELECT, vendedor_id como clave","Compara lecturas lógicas o filas antes/después"]],
