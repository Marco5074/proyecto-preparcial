<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración de BD: memoria y repaso</title>
<style>
  :root { --fondo:#eef1f6; --tinta:#1b2433; --ok:#1f8a5b; --mal:#c8433b; --acento:#f0a500; --azul:#1f4fbf; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:16px/1.55 Verdana, sans-serif; }
  header { background:var(--tinta); padding:10px 12px; position:sticky; top:0; z-index:2; }
  header h1 { margin:0 0 8px; font-size:1.05rem; color:#fff; }
  .fila-tema { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .fila-tema label { color:#fff; font-size:.9rem; white-space:nowrap; }
  #menu { flex:1; min-width:0; font:inherit; padding:9px; border:2px solid #fff; border-radius:8px; background:#000; color:#fff; font-weight:bold; color-scheme:dark; }
  #menu option { background:#000; color:#fff; }
  #menu:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  #modos { display:flex; gap:6px; }
  #modos button { flex:1; font:inherit; font-size:.9rem; padding:8px; border:2px solid #9fb0cc; background:transparent; color:#fff; border-radius:8px; cursor:pointer; }
  #modos button[aria-selected="true"] { background:var(--acento); color:var(--tinta); border-color:var(--acento); font-weight:bold; }
  main { max-width:700px; margin:0 auto; padding:18px 16px 40px; }
  .tarjeta { background:#fff; border:2px solid var(--tinta); border-radius:10px; padding:18px; }
  button:focus-visible { outline:3px solid var(--acento); outline-offset:2px; }
  #progreso { opacity:.7; margin:0 0 8px; }
  .barra { height:8px; background:#cfd6e3; border-radius:4px; margin-bottom:14px; }
  .barra div { height:100%; width:0; background:var(--ok); border-radius:4px; transition:width .3s; }
  .etiqueta { font-size:.85rem; font-weight:bold; color:#6a5200; background:var(--acento); display:inline-block; padding:1px 10px; border-radius:10px; }
  #pregunta { font-size:1.1rem; font-weight:bold; margin:10px 0 0; }
  #def { margin:10px 0 0; padding:10px 12px; background:#f3f5fa; border-left:6px solid var(--tinta); border-radius:6px; }
  #opciones { display:grid; gap:8px; margin-top:14px; }
  #opciones button { font:inherit; text-align:left; padding:10px 12px; border:2px solid var(--tinta); background:#fff; color:var(--tinta); border-radius:8px; cursor:pointer; }
  #opciones button:hover:not(:disabled) { background:#f3f5fa; }
  #opciones button.ok { background:#dff3e9; border-color:var(--ok); font-weight:bold; }
  #opciones button.mal { background:#f9e0de; border-color:var(--mal); }
  #msg { margin-top:14px; padding:10px 12px; border-radius:8px; display:none; }
  #msg.ok { display:block; background:#dff3e9; border-left:6px solid var(--ok); }
  #msg.mal { display:block; background:#f9e0de; border-left:6px solid var(--mal); }
  .principal { margin-top:12px; width:100%; font:inherit; padding:10px 16px; border:2px solid var(--tinta); background:var(--tinta); color:#fff; border-radius:8px; cursor:pointer; }
  /* Repaso */
  #chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  #chips button { font:inherit; font-size:.85rem; min-width:36px; padding:4px 8px; border:2px solid var(--tinta); background:#fff; color:var(--tinta); border-radius:8px; cursor:pointer; }
  #chips button[aria-current="true"] { background:var(--tinta); color:#fff; }
  #rep h2 { margin:8px 0 8px; font-size:1.25rem; color:var(--azul); }
  #rep p { margin:6px 0; } #rep ul { margin:6px 0; padding-left:20px; } #rep li { margin:3px 0; }
  #rep pre { background:#eef1f6; border:1px solid #c5cde0; border-radius:6px; padding:10px; overflow-x:auto; font:13px/1.45 Consolas, Menlo, monospace; margin:8px 0; }
  #rep table { border-collapse:collapse; width:100%; margin:8px 0; font-size:.9rem; }
  #rep th, #rep td { border:1px solid #c5cde0; padding:6px 8px; text-align:left; vertical-align:top; }
  #rep th { background:#dfe7fb; } #rep td:first-child { background:#f3f5fa; font-weight:bold; }
  .extra { color:#b45309; font-weight:bold; } .nota { background:#fff3d1; border-left:6px solid var(--acento); padding:8px 10px; border-radius:6px; margin:8px 0; }
  .regla { background:#dfe7fb; border-left:6px solid var(--azul); padding:8px 10px; border-radius:6px; margin:8px 0; font-weight:bold; }
  .nav { display:flex; gap:8px; margin-top:12px; }
  .nav button { flex:1; font:inherit; padding:10px; border:2px solid var(--tinta); background:#fff; color:var(--tinta); border-radius:8px; cursor:pointer; }
  .nav button:disabled { opacity:.4; cursor:default; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<header>
  <h1>Administración de bases de datos</h1>
  <div class="fila-tema"><label for="menu">Tema:</label><select id="menu" aria-label="Elegir tema"></select></div>
  <div id="modos" role="tablist">
    <button id="m-mem" role="tab" aria-selected="true">Memoria</button>
    <button id="m-rep" role="tab" aria-selected="false">Repaso</button>
  </div>
</header>
<main>
  <section id="mem">
    <p id="progreso"></p>
    <div class="barra"><div id="avance"></div></div>
    <div class="tarjeta">
      <span class="etiqueta" id="etq"></span>
      <p id="pregunta"></p>
      <div id="def"></div>
      <div id="opciones"></div>
      <div id="msg" role="status"></div>
      <button id="sig" class="principal" hidden>Siguiente</button>
    </div>
  </section>
  <section id="rep" hidden>
    <div id="chips"></div>
    <div class="tarjeta" id="contenido"></div>
    <div class="nav"><button id="ant">Anterior</button><button id="prox">Siguiente</button></div>
  </section>
</main>

<script>
/* ---------- MEMORIA: [concepto, definición] ---------- */
const TEMAS = [{"n": "Privilegios", "c": [["Privilegio", "Permiso específico que un usuario o rol recibe para realizar acciones en el servidor, la base de datos o un objeto. Es la base del control de acceso en un DBMS."], ["Privilegios de servidor", "Afectan a toda la instancia y se otorgan a logins. Ejemplos: ALTER ANY LOGIN (crear o modificar logins), CREATE DATABASE, VIEW ANY DATABASE y CONTROL SERVER (control total sobre el servidor, similar a sysadmin)."], ["Privilegios de base de datos", "Aplican a una base de datos en particular y se otorgan a usuarios y roles de esa base. Ejemplos: CONTROL DATABASE (control total sobre la base), ALTER DATABASE, ALTER ANY USER (administrar usuarios), CREATE TABLE y BACKUP DATABASE / BACKUP LOG."], ["Privilegios de objeto", "Aplican a un objeto (tabla, vista, procedimiento o función) sin afectar a otros. Ejemplos: SELECT, INSERT, UPDATE, DELETE, EXECUTE, REFERENCES, ALTER y CONTROL (control total sobre el objeto)."], ["GRANT", "Comando que otorga privilegios a usuarios o roles. Ejemplo: GRANT SELECT, UPDATE ON dbo.Clientes TO Usuario1;"], ["REVOKE", "Comando que quita un privilegio otorgado, pero no bloquea los privilegios basados en roles: si el usuario lo recibe por otro rol, lo conserva. Ejemplo: REVOKE UPDATE ON dbo.Clientes FROM Usuario1;"], ["DENY", "Comando que niega explícitamente un privilegio y lo impide siempre, incluso si el usuario lo recibe a través de otro rol o grupo. Es el primero en la jerarquía (DENY, REVOKE, GRANT). Ejemplo: DENY DELETE ON dbo.Clientes TO Usuario1;"], ["Privilegios directos", "Los asignados al usuario explícitamente, por ejemplo con GRANT SELECT TO Usuario1."], ["Privilegios heredados", "Los recibidos por pertenecer a un rol (Usuario1 ∈ rol_ventas). Ejemplo en SQL Server: si un usuario pertenece a db_datareader puede leer todas las tablas aunque no tenga GRANT directo."]], "r": [{"t": "Privilegio", "h": "<p>Permiso específico que un usuario o rol recibe para realizar acciones en el servidor, la base de datos o un objeto. Es la base del control de acceso en un DBMS.</p>"}, {"t": "Privilegios de servidor", "h": "<p>Afectan a toda la instancia y se otorgan a logins. Ejemplos: ALTER ANY LOGIN (crear o modificar logins), CREATE DATABASE, VIEW ANY DATABASE y CONTROL SERVER (control total sobre el servidor, similar a sysadmin).</p>"}, {"t": "Privilegios de base de datos", "h": "<p>Aplican a una base de datos en particular y se otorgan a usuarios y roles de esa base. Ejemplos: CONTROL DATABASE (control total sobre la base), ALTER DATABASE, ALTER ANY USER (administrar usuarios), CREATE TABLE y BACKUP DATABASE / BACKUP LOG.</p>"}, {"t": "Privilegios de objeto", "h": "<p>Aplican a un objeto (tabla, vista, procedimiento o función) sin afectar a otros. Ejemplos: SELECT, INSERT, UPDATE, DELETE, EXECUTE, REFERENCES, ALTER y CONTROL (control total sobre el objeto).</p>"}, {"t": "GRANT", "h": "<p>Comando que otorga privilegios a usuarios o roles. Ejemplo: GRANT SELECT, UPDATE ON dbo.Clientes TO Usuario1;</p>"}, {"t": "REVOKE", "h": "<p>Comando que quita un privilegio otorgado, pero no bloquea los privilegios basados en roles: si el usuario lo recibe por otro rol, lo conserva. Ejemplo: REVOKE UPDATE ON dbo.Clientes FROM Usuario1;</p>"}, {"t": "DENY", "h": "<p>Comando que niega explícitamente un privilegio y lo impide siempre, incluso si el usuario lo recibe a través de otro rol o grupo. Es el primero en la jerarquía (DENY, REVOKE, GRANT). Ejemplo: DENY DELETE ON dbo.Clientes TO Usuario1;</p>"}, {"t": "Privilegios directos", "h": "<p>Los asignados al usuario explícitamente, por ejemplo con GRANT SELECT TO Usuario1.</p>"}, {"t": "Privilegios heredados", "h": "<p>Los recibidos por pertenecer a un rol (Usuario1 ∈ rol_ventas). Ejemplo en SQL Server: si un usuario pertenece a db_datareader puede leer todas las tablas aunque no tenga GRANT directo.</p>"}, {"t": "Ejemplo de código · Otorgar y quitar un privilegio", "h": "<p><b>Enunciado:</b> Usuario1 necesita consultar y actualizar la tabla dbo.Clientes. Después, solo se le debe quitar el UPDATE.</p><p><b>Solución:</b></p><pre>-- otorgar SELECT y UPDATE sobre Clientes\nGRANT SELECT, UPDATE ON dbo.Clientes TO Usuario1;\n-- quitar el UPDATE sobre Clientes\nREVOKE UPDATE ON dbo.Clientes FROM Usuario1;</pre>"}, {"t": "Ejemplo de código · Negar aunque venga por un rol", "h": "<p><b>Enunciado:</b> Usuario1 pertenece a un rol que le permite borrar registros de dbo.Clientes, pero nunca debe poder hacerlo, ni siquiera si lo recibe por otro rol o grupo.</p><p><b>Solución:</b></p><pre>-- negar explícitamente DELETE sobre Clientes\nDENY DELETE ON dbo.Clientes TO Usuario1;</pre>"}, {"t": "Ejemplo de código · Privilegio de servidor y de base de datos", "h": "<p><b>Enunciado:</b> Permite al login Login1 crear bases de datos y al usuario Usuario1 crear tablas en la base actual.</p><p><b>Solución:</b></p><pre>-- otorgar CREATE DATABASE al login\nGRANT CREATE DATABASE TO Login1;\n-- otorgar CREATE TABLE al usuario\nGRANT CREATE TABLE TO Usuario1;</pre>"}, {"t": "Ejemplo de código · Privilegio de objeto: ejecutar", "h": "<p><b>Enunciado:</b> Usuario4 debe poder ejecutar el procedimiento almacenado dbo.spProcesarPago y nada más.</p><p><b>Solución:</b></p><pre>-- otorgar EXECUTE sobre el procedimiento\nGRANT EXECUTE ON dbo.spProcesarPago TO Usuario4;</pre>"}]}, {"n": "Roles", "c": [["Rol", "Mecanismo que permite agrupar privilegios para asignarlos de forma más sencilla y segura. Funciona como «contenedor» de permisos reutilizable por múltiples usuarios; es un perfil de seguridad que define lo que un conjunto de usuarios puede o no hacer dentro de una base de datos."], ["Beneficios de los roles", "Gestión centralizada (simplifica el control de privilegios de usuario), reducción de errores en la asignación de permisos y principio de privilegios mínimos (asignar solo los permisos necesarios)."], ["db_owner", "Control total sobre la base de datos: crear, modificar y eliminar cualquier objeto y ejecutar backups/restauraciones. Para administradores de la base o cuando se necesita gestión completa de la base sin ser sysadmin de todo el servidor."], ["db_securityadmin", "Administra roles y miembros de roles, y concede/revoca permisos a nivel de base. Para encargados de seguridad de la información: manejan accesos pero no modifican datos."], ["db_accessadmin", "Agrega o quita usuarios en la base. Para DBAs o personal de soporte que administran accesos, pero no objetos."], ["db_backupoperator", "Realiza copias de seguridad de la base. Permite delegar backups (personal de operaciones o respaldo) sin dar control total sobre la base."], ["db_ddladmin", "Ejecuta comandos DDL (CREATE, ALTER, DROP) y puede modificar cualquier esquema u objeto. Para desarrolladores que crean/modifican estructuras; no recomendable en producción sin control estricto."], ["db_datareader", "Consulta (SELECT) todas las tablas y vistas de la base. Lectura global, sin permisos de escritura: analistas de datos, BI y usuarios de reportes."], ["db_datawriter", "INSERT, UPDATE y DELETE en todas las tablas y vistas. Para operadores que mantienen datos o personal que gestiona operaciones en tablas (por ejemplo, ventas)."], ["db_denydatareader", "Niega permisos de lectura (impide SELECT). Sirve para restringir usuarios que no deben acceder a datos, aunque tengan otros privilegios."], ["db_denydatawriter", "Niega permisos de escritura (INSERT, UPDATE, DELETE). Para usuarios que pueden conectarse pero no deben alterar datos."], ["Rol personalizado", "Rol creado por el administrador: se crea con CREATE ROLE rol_reportes; se le dan permisos con GRANT SELECT ON dbo.Ventas TO rol_reportes; y se le asignan usuarios con ALTER ROLE rol_reportes ADD MEMBER usuarioBD;"]], "r": [{"t": "Rol", "h": "<p>Mecanismo que permite agrupar privilegios para asignarlos de forma más sencilla y segura. Funciona como «contenedor» de permisos reutilizable por múltiples usuarios; es un perfil de seguridad que define lo que un conjunto de usuarios puede o no hacer dentro de una base de datos.</p>"}, {"t": "Beneficios de los roles", "h": "<p>Gestión centralizada (simplifica el control de privilegios de usuario), reducción de errores en la asignación de permisos y principio de privilegios mínimos (asignar solo los permisos necesarios).</p>"}, {"t": "db_owner", "h": "<p>Control total sobre la base de datos: crear, modificar y eliminar cualquier objeto y ejecutar backups/restauraciones. Para administradores de la base o cuando se necesita gestión completa de la base sin ser sysadmin de todo el servidor.</p>"}, {"t": "db_securityadmin", "h": "<p>Administra roles y miembros de roles, y concede/revoca permisos a nivel de base. Para encargados de seguridad de la información: manejan accesos pero no modifican datos.</p>"}, {"t": "db_accessadmin", "h": "<p>Agrega o quita usuarios en la base. Para DBAs o personal de soporte que administran accesos, pero no objetos.</p>"}, {"t": "db_backupoperator", "h": "<p>Realiza copias de seguridad de la base. Permite delegar backups (personal de operaciones o respaldo) sin dar control total sobre la base.</p>"}, {"t": "db_ddladmin", "h": "<p>Ejecuta comandos DDL (CREATE, ALTER, DROP) y puede modificar cualquier esquema u objeto. Para desarrolladores que crean/modifican estructuras; no recomendable en producción sin control estricto.</p>"}, {"t": "db_datareader", "h": "<p>Consulta (SELECT) todas las tablas y vistas de la base. Lectura global, sin permisos de escritura: analistas de datos, BI y usuarios de reportes.</p>"}, {"t": "db_datawriter", "h": "<p>INSERT, UPDATE y DELETE en todas las tablas y vistas. Para operadores que mantienen datos o personal que gestiona operaciones en tablas (por ejemplo, ventas).</p>"}, {"t": "db_denydatareader", "h": "<p>Niega permisos de lectura (impide SELECT). Sirve para restringir usuarios que no deben acceder a datos, aunque tengan otros privilegios.</p>"}, {"t": "db_denydatawriter", "h": "<p>Niega permisos de escritura (INSERT, UPDATE, DELETE). Para usuarios que pueden conectarse pero no deben alterar datos.</p>"}, {"t": "Rol personalizado", "h": "<p>Rol creado por el administrador: se crea con CREATE ROLE rol_reportes; se le dan permisos con GRANT SELECT ON dbo.Ventas TO rol_reportes; y se le asignan usuarios con ALTER ROLE rol_reportes ADD MEMBER usuarioBD;</p>"}, {"t": "Ejemplo de código · Rol personalizado de reportes", "h": "<p><b>Enunciado:</b> Crea el rol rol_reportes. Debe poder consultar dbo.Ventas y ejecutar dbo.spGenerarInforme. Luego agrega al usuario de base de datos usuarioBD como miembro.</p><p><b>Solución:</b></p><pre>-- crear el rol\nCREATE ROLE rol_reportes;\n-- SELECT sobre Ventas al rol\nGRANT SELECT ON dbo.Ventas TO rol_reportes;\n-- EXECUTE sobre el procedimiento al rol\nGRANT EXECUTE ON dbo.spGenerarInforme TO rol_reportes;\n-- agregar el usuario al rol\nALTER ROLE rol_reportes ADD MEMBER usuarioBD;</pre>"}, {"t": "Ejemplo de código · Rol predefinido de solo lectura", "h": "<p><b>Enunciado:</b> En el servidor crea el login user_reportes con contraseña 'Reporte123$'. En la base GameWorld crea el usuario user_reportes para ese login y dale lectura de todas las tablas con un rol predefinido.</p><p><b>Solución:</b></p><pre>-- crear el login\nCREATE LOGIN user_reportes WITH PASSWORD = 'Reporte123$';\n-- usar la base GameWorld\nUSE GameWorld;\n-- crear el usuario para el login\nCREATE USER user_reportes FOR LOGIN user_reportes;\n-- agregarlo a db_datareader\nALTER ROLE db_datareader ADD MEMBER user_reportes;</pre>"}, {"t": "Ejemplo de código · Rol de operaciones sin DELETE", "h": "<p><b>Enunciado:</b> Crea el rol rol_operaciones con permiso de INSERT y UPDATE sobre dbo.Ventas (sin DELETE). Crea el login user_operador con contraseña 'Operador123$', su usuario en la base actual y agrégalo al rol.</p><p><b>Solución:</b></p><pre>-- crear el rol\nCREATE ROLE rol_operaciones;\n-- INSERT y UPDATE al rol\nGRANT INSERT, UPDATE ON dbo.Ventas TO rol_operaciones;\n-- crear el login\nCREATE LOGIN user_operador WITH PASSWORD = 'Operador123$';\n-- crear el usuario\nCREATE USER user_operador FOR LOGIN user_operador;\n-- agregar el usuario al rol\nALTER ROLE rol_operaciones ADD MEMBER user_operador;</pre>"}, {"t": "Ejemplo de código · Probar los permisos de un usuario", "h": "<p><b>Enunciado:</b> Cambia el contexto al usuario user_reportes, consulta solo 5 filas de dbo.Clientes y regresa al contexto original.</p><p><b>Solución:</b></p><pre>-- cambiar de contexto\nEXECUTE AS USER = 'user_reportes';\n-- consultar 5 filas\nSELECT TOP (5) * FROM dbo.Clientes;\n-- volver al contexto original\nREVERT;</pre>"}]}, {"n": "Usuarios y autenticación", "c": [["Autenticación de Windows", "Usa las credenciales del sistema operativo (usuario de Windows o de dominio). Es más segura porque delega el control de contraseñas a Windows (caducidad, complejidad) y no pide usuario/contraseña adicionales al conectarse desde la misma sesión."], ["Autenticación mixta", "Permite usar cuentas de Windows y cuentas de SQL Server. Los logins se gestionan dentro de SQL Server (el DBA define usuario y contraseña) y es el modo más usado en entornos corporativos por su flexibilidad. En modo mixto se define la contraseña del usuario sa."], ["Habilitar autenticación mixta después de instalar", "En SSMS: clic derecho en el servidor → Propiedades; ir a la pestaña Seguridad; seleccionar «SQL Server and Windows Authentication mode»; reiniciar el servicio de SQL Server."], ["Login", "Credencial de acceso al servidor de bases de datos: contiene el nombre de usuario y el mecanismo de autenticación (Windows o SQL Server). Permite la conexión al motor, pero no garantiza acceso a ninguna base de datos en particular. Ejemplo: CREATE LOGIN appUser WITH PASSWORD = '...', CHECK_POLICY = ON, CHECK_EXPIRATION = ON;"], ["Usuario", "Identidad dentro de una base de datos específica; es quien recibe permisos sobre tablas, vistas, procedimientos, etc. Está vinculado a un login (excepto los usuarios contenidos). Ejemplo: CREATE USER appUserDB FOR LOGIN appUser;"], ["Usuario sa", "System Administrator: cuenta cuya contraseña se define en la instalación en modo mixto. Debe deshabilitarse o renombrarse, salvo que sea estrictamente necesaria."], ["Buenas prácticas en la gestión de usuarios", "Credenciales únicas (un login por persona o aplicación, sin compartir), usar roles y perfiles, deshabilitar o renombrar sa, preferir autenticación de Windows, mínimos privilegios, auditar accesos y revisar cuentas inactivas, políticas de contraseñas (complejidad y caducidad) y habilitar mixta solo si hay aplicaciones externas o accesos fuera del dominio."]], "r": [{"t": "Autenticación de Windows", "h": "<p>Usa las credenciales del sistema operativo (usuario de Windows o de dominio). Es más segura porque delega el control de contraseñas a Windows (caducidad, complejidad) y no pide usuario/contraseña adicionales al conectarse desde la misma sesión.</p>"}, {"t": "Autenticación mixta", "h": "<p>Permite usar cuentas de Windows y cuentas de SQL Server. Los logins se gestionan dentro de SQL Server (el DBA define usuario y contraseña) y es el modo más usado en entornos corporativos por su flexibilidad. En modo mixto se define la contraseña del usuario sa.</p>"}, {"t": "Habilitar autenticación mixta después de instalar", "h": "<p>En SSMS: clic derecho en el servidor → Propiedades; ir a la pestaña Seguridad; seleccionar «SQL Server and Windows Authentication mode»; reiniciar el servicio de SQL Server.</p>"}, {"t": "Login", "h": "<p>Credencial de acceso al servidor de bases de datos: contiene el nombre de usuario y el mecanismo de autenticación (Windows o SQL Server). Permite la conexión al motor, pero no garantiza acceso a ninguna base de datos en particular. Ejemplo: CREATE LOGIN appUser WITH PASSWORD = '...', CHECK_POLICY = ON, CHECK_EXPIRATION = ON;</p>"}, {"t": "Usuario", "h": "<p>Identidad dentro de una base de datos específica; es quien recibe permisos sobre tablas, vistas, procedimientos, etc. Está vinculado a un login (excepto los usuarios contenidos). Ejemplo: CREATE USER appUserDB FOR LOGIN appUser;</p>"}, {"t": "Usuario sa", "h": "<p>System Administrator: cuenta cuya contraseña se define en la instalación en modo mixto. Debe deshabilitarse o renombrarse, salvo que sea estrictamente necesaria.</p>"}, {"t": "Buenas prácticas en la gestión de usuarios", "h": "<p>Credenciales únicas (un login por persona o aplicación, sin compartir), usar roles y perfiles, deshabilitar o renombrar sa, preferir autenticación de Windows, mínimos privilegios, auditar accesos y revisar cuentas inactivas, políticas de contraseñas (complejidad y caducidad) y habilitar mixta solo si hay aplicaciones externas o accesos fuera del dominio.</p>"}, {"t": "Ejemplo de código · Login con política y su usuario", "h": "<p><b>Enunciado:</b> Crea el login appUser con contraseña 'AppUser2025!' que aplique las reglas de Windows y la caducidad de contraseña. Luego, en la base Ventas, crea el usuario appUserDB para ese login.</p><p><b>Solución:</b></p><pre>-- crear el login con las dos políticas\nCREATE LOGIN appUser WITH PASSWORD = 'AppUser2025!', CHECK_POLICY = ON, CHECK_EXPIRATION = ON;\n-- usar la base Ventas\nUSE Ventas;\n-- crear el usuario para el login\nCREATE USER appUserDB FOR LOGIN appUser;</pre>"}, {"t": "Ejemplo de código · Ver usuarios y roles de la base", "h": "<p><b>Enunciado:</b> Muestra el nombre y la descripción del tipo de los usuarios de la base (tipos 'S' y 'U') y, en otra consulta, de los roles (tipo 'R').</p><p><b>Solución:</b></p><pre>-- listar usuarios\nSELECT name, type_desc FROM sys.database_principals WHERE type IN ('S','U');\n-- listar roles\nSELECT name, type_desc FROM sys.database_principals WHERE type = 'R';</pre>"}]}, {"n": "Bases autocontenidas", "c": [["Base de datos autocontenida", "Minimiza las dependencias externas con el servidor y puede moverse entre instancias de SQL Server con menos problemas, porque incluye la información de configuración necesaria (usuarios, collation parcial, metadatos, etc.)."], ["Usuario contenido", "Usuario que existe dentro de la base y no depende de logins del servidor. Ejemplo: CREATE USER Ana WITH PASSWORD = 'Ana2025!';"], ["Modo de contención NONE", "Valor por defecto: la base depende del servidor (logins, configuraciones)."], ["Modo de contención PARTIAL", "Habilita el uso de usuarios contenidos, pero aún hay dependencias con el servidor (por ejemplo, jobs, linked servers). En la práctica «autocontenida» significa parcial, porque no todas las dependencias se eliminan. Ejemplo: ALTER DATABASE Biblioteca SET CONTAINMENT = PARTIAL;"], ["Pasos para usar una base contenida", "1) Habilitar la autenticación autocontenida en el servidor: EXEC sp_configure 'contained database authentication', 1; RECONFIGURE; 2) Configurar la base con CONTAINMENT = PARTIAL; 3) Crear el usuario contenido dentro de la base con CREATE USER ... WITH PASSWORD."], ["Usuarios huérfanos", "Riesgo de las bases normales al moverlas entre servidores: sus usuarios dependen de logins, por lo que hay que recrear logins y sincronizar SIDs. Las bases autocontenidas evitan este problema."], ["Ventajas y desventajas de las bases autocontenidas", "Ventajas: portabilidad (más fácil mover bases entre servidores), aislamiento (cada base con sus usuarios y configuraciones) y evita logins huérfanos. Desventajas: complejidad en la seguridad (los usuarios contenidos no se centralizan), aún requieren dependencias externas y no siempre se recomiendan en entornos grandes con administración centralizada."]], "r": [{"t": "Base de datos autocontenida", "h": "<p>Minimiza las dependencias externas con el servidor y puede moverse entre instancias de SQL Server con menos problemas, porque incluye la información de configuración necesaria (usuarios, collation parcial, metadatos, etc.).</p>"}, {"t": "Usuario contenido", "h": "<p>Usuario que existe dentro de la base y no depende de logins del servidor. Ejemplo: CREATE USER Ana WITH PASSWORD = 'Ana2025!';</p>"}, {"t": "Modo de contención NONE", "h": "<p>Valor por defecto: la base depende del servidor (logins, configuraciones).</p>"}, {"t": "Modo de contención PARTIAL", "h": "<p>Habilita el uso de usuarios contenidos, pero aún hay dependencias con el servidor (por ejemplo, jobs, linked servers). En la práctica «autocontenida» significa parcial, porque no todas las dependencias se eliminan. Ejemplo: ALTER DATABASE Biblioteca SET CONTAINMENT = PARTIAL;</p>"}, {"t": "Pasos para usar una base contenida", "h": "<p>1) Habilitar la autenticación autocontenida en el servidor: EXEC sp_configure 'contained database authentication', 1; RECONFIGURE; 2) Configurar la base con CONTAINMENT = PARTIAL; 3) Crear el usuario contenido dentro de la base con CREATE USER ... WITH PASSWORD.</p>"}, {"t": "Usuarios huérfanos", "h": "<p>Riesgo de las bases normales al moverlas entre servidores: sus usuarios dependen de logins, por lo que hay que recrear logins y sincronizar SIDs. Las bases autocontenidas evitan este problema.</p>"}, {"t": "Ventajas y desventajas de las bases autocontenidas", "h": "<p>Ventajas: portabilidad (más fácil mover bases entre servidores), aislamiento (cada base con sus usuarios y configuraciones) y evita logins huérfanos. Desventajas: complejidad en la seguridad (los usuarios contenidos no se centralizan), aún requieren dependencias externas y no siempre se recomiendan en entornos grandes con administración centralizada.</p>"}, {"t": "Ejemplo de código · Habilitar y crear una base contenida", "h": "<p><b>Enunciado:</b> Habilita la autenticación de bases contenidas en el servidor y crea la base Ventas con contención parcial.</p><p><b>Solución:</b></p><pre>-- habilitar la opción en el servidor\nEXEC sp_configure 'contained database authentication', 1;\n-- aplicar la configuración\nRECONFIGURE;\n-- crear la base con contención parcial\nCREATE DATABASE Ventas CONTAINMENT = PARTIAL;</pre>"}, {"t": "Ejemplo de código · Usuario contenido en una base existente", "h": "<p><b>Enunciado:</b> La base Biblioteca ya existe sin contención. Conviértela a contención parcial y crea dentro de ella el usuario contenido Ana con contraseña 'Ana2025!'.</p><p><b>Solución:</b></p><pre>-- pasar la base a contención parcial\nALTER DATABASE Biblioteca SET CONTAINMENT = PARTIAL;\n-- usar la base\nUSE Biblioteca;\n-- crear el usuario contenido\nCREATE USER Ana WITH PASSWORD = 'Ana2025!';</pre>"}]}, {"n": "Políticas y auditoría", "c": [["Políticas de login", "En SQL Server no existen perfiles como en Oracle: se usan políticas de login con CHECK_POLICY = ON (aplica las reglas de Windows) y CHECK_EXPIRATION = ON (caducidad de la contraseña)."], ["Política de seguridad local de Windows", "Lugar donde se configura la política de contraseñas (longitud mínima, caducidad en días, etc.), no en SQL Server. Si el servidor está en dominio, se configura en Active Directory; SQL Server simplemente hereda esas reglas."], ["SQL Audit", "Mecanismo nativo de SQL Server para registrar actividades y accesos, con fines de seguridad, cumplimiento y control. Sus componentes principales son Server Audit y Database Audit Specification."], ["Server Audit", "Componente de SQL Audit con alcance de auditoría centralizado; define el destino de los registros. Ejemplo: CREATE SERVER AUDIT AuditoriaBasica TO FILE (...) y se activa con ALTER SERVER AUDIT ... WITH (STATE = ON);"], ["Database Audit Specification", "Componente de SQL Audit con alcance específico: define las acciones a auditar en una base (por ejemplo, SELECT, INSERT, DELETE ON dbo.Empleados BY PUBLIC). Una base solo puede tener una activa."], ["Niveles de auditoría", "Servidor (logins, roles, backups, cambios de configuración), base de datos (DML/DDL sobre tablas, vistas, procedimientos) y columna (solo UPDATE, por ejemplo sobre el campo Salario)."], ["Destinos de la auditoría", "Archivos (.sqlaudit), consultables con T-SQL o SSMS; Application Log de Windows y Security Log de Windows, integrados con Event Viewer."], ["sys.fn_get_audit_file", "Función de T-SQL para consultar los registros de auditoría guardados en archivo. También se pueden ver en SSMS (Object Explorer → Security → Audits → View Audit Logs) o en el Event Viewer de Windows."], ["Limitaciones de SQL Audit", "SELECT solo se audita a nivel de tabla (no de columna); UPDATE sí puede ser por columna; una base solo puede tener 1 Database Audit Specification activa; y puede generar sobrecarga en el rendimiento del servidor."], ["Casos de uso de SQL Audit", "Cumplimiento normativo (SOX, HIPAA, PCI-DSS), control de acceso a datos (tablas de clientes, sueldos, tarjetas), detección de actividades sospechosas (inicios de sesión fallidos, cambios de permisos) y auditoría de cambios de seguridad (creación de roles, cambios de privilegios)."]], "r": [{"t": "Políticas de login", "h": "<p>En SQL Server no existen perfiles como en Oracle: se usan políticas de login con CHECK_POLICY = ON (aplica las reglas de Windows) y CHECK_EXPIRATION = ON (caducidad de la contraseña).</p>"}, {"t": "Política de seguridad local de Windows", "h": "<p>Lugar donde se configura la política de contraseñas (longitud mínima, caducidad en días, etc.), no en SQL Server. Si el servidor está en dominio, se configura en Active Directory; SQL Server simplemente hereda esas reglas.</p>"}, {"t": "SQL Audit", "h": "<p>Mecanismo nativo de SQL Server para registrar actividades y accesos, con fines de seguridad, cumplimiento y control. Sus componentes principales son Server Audit y Database Audit Specification.</p>"}, {"t": "Server Audit", "h": "<p>Componente de SQL Audit con alcance de auditoría centralizado; define el destino de los registros. Ejemplo: CREATE SERVER AUDIT AuditoriaBasica TO FILE (...) y se activa con ALTER SERVER AUDIT ... WITH (STATE = ON);</p>"}, {"t": "Database Audit Specification", "h": "<p>Componente de SQL Audit con alcance específico: define las acciones a auditar en una base (por ejemplo, SELECT, INSERT, DELETE ON dbo.Empleados BY PUBLIC). Una base solo puede tener una activa.</p>"}, {"t": "Niveles de auditoría", "h": "<p>Servidor (logins, roles, backups, cambios de configuración), base de datos (DML/DDL sobre tablas, vistas, procedimientos) y columna (solo UPDATE, por ejemplo sobre el campo Salario).</p>"}, {"t": "Destinos de la auditoría", "h": "<p>Archivos (.sqlaudit), consultables con T-SQL o SSMS; Application Log de Windows y Security Log de Windows, integrados con Event Viewer.</p>"}, {"t": "sys.fn_get_audit_file", "h": "<p>Función de T-SQL para consultar los registros de auditoría guardados en archivo. También se pueden ver en SSMS (Object Explorer → Security → Audits → View Audit Logs) o en el Event Viewer de Windows.</p>"}, {"t": "Limitaciones de SQL Audit", "h": "<p>SELECT solo se audita a nivel de tabla (no de columna); UPDATE sí puede ser por columna; una base solo puede tener 1 Database Audit Specification activa; y puede generar sobrecarga en el rendimiento del servidor.</p>"}, {"t": "Casos de uso de SQL Audit", "h": "<p>Cumplimiento normativo (SOX, HIPAA, PCI-DSS), control de acceso a datos (tablas de clientes, sueldos, tarjetas), detección de actividades sospechosas (inicios de sesión fallidos, cambios de permisos) y auditoría de cambios de seguridad (creación de roles, cambios de privilegios).</p>"}, {"t": "Ejemplo de código · Auditoría de servidor a archivo", "h": "<p><b>Enunciado:</b> En master, crea la auditoría AuditoriaBasica que guarde los eventos en archivos en '/audit/' (MAXSIZE de 10 MB y máximo 5 archivos), que continúe si falla (ON_FAILURE) y luego actívala.</p><p><b>Solución:</b></p><pre>-- usar master\nUSE master;\n-- crear la auditoría de servidor\nCREATE SERVER AUDIT AuditoriaBasica TO FILE (FILEPATH = '/audit/', MAXSIZE = 10 MB, MAX_FILES = 5) WITH (ON_FAILURE = CONTINUE);\n-- activar la auditoría\nALTER SERVER AUDIT AuditoriaBasica WITH (STATE = ON);</pre>"}, {"t": "Ejemplo de código · Especificación de auditoría de base", "h": "<p><b>Enunciado:</b> En la base miDB crea la especificación AuditoriaBasicaDB para la auditoría AuditoriaBasica que registre SELECT, INSERT y DELETE sobre dbo.Empleados realizados por PUBLIC, y actívala.</p><p><b>Solución:</b></p><pre>-- usar la base\nUSE miDB;\n-- crear la especificación\nCREATE DATABASE AUDIT SPECIFICATION AuditoriaBasicaDB FOR SERVER AUDIT AuditoriaBasica ADD (SELECT, INSERT, DELETE ON dbo.Empleados BY PUBLIC);\n-- activar la especificación\nALTER DATABASE AUDIT SPECIFICATION AuditoriaBasicaDB WITH (STATE = ON);</pre>"}, {"t": "Ejemplo de código · Consultar los registros de auditoría", "h": "<p><b>Enunciado:</b> Lee los archivos de '/audit/*' mostrando event_time, action_id, succeeded, server_principal_name, database_name, schema_name, object_name y statement, del más reciente al más antiguo. Usa DEFAULT en los otros dos parámetros de la función.</p><p><b>Solución:</b></p><pre>-- consultar el archivo de auditoría\nSELECT event_time, action_id, succeeded, server_principal_name, database_name, schema_name, object_name, statement FROM sys.fn_get_audit_file('/audit/*', DEFAULT, DEFAULT) ORDER BY event_time DESC;</pre>"}]}, {"n": "Índices: arquitectura (clustered, INCLUDE...)", "c": [["Table Scan / Clustered Index Scan", "Lo que hace el motor cuando no tiene rutas optimizadas: lee todas las filas una por una (en el ejemplo, 10,100 filas para devolver solo 1). Destruye el rendimiento."], ["Índice", "Estructura de datos externa (como un árbol B) que permite al optimizador de consultas encontrar filas específicas a gran velocidad, sin escanear toda la tabla. Tú defines qué buscar y el motor decide cómo encontrarlo."], ["Árbol B", "Estructura de datos en forma de árbol (raíz, niveles intermedios y nivel hoja) en la que se implementa un índice; el motor baja por ella en pocos saltos hasta el valor buscado en lugar de recorrer toda la tabla."], ["Índice agrupado", "Dicta el orden físico real de los datos en el disco. Solo puede existir uno por tabla (los datos no pueden ordenarse físicamente de dos maneras a la vez). Es ideal para claves primarias y rangos de datos. Analogía: un diccionario; el libro entero ES el índice."], ["Índice no agrupado", "Estructura totalmente separada de los datos reales que contiene la clave ordenada y un puntero a la fila exacta. Puede haber múltiples por tabla, para diferentes tipos de búsquedas. Analogía: el glosario al final de un libro."], ["Clustered Index Seek", "Búsqueda directa a través del índice agrupado: el motor localiza las filas usando el orden físico de los datos (por ejemplo por clave primaria o por rango), sin leer toda la tabla."], ["Index Seek", "Búsqueda directa dentro de un índice: el motor baja por el árbol hasta las filas necesarias sin escanear todo. Es la operación de una consulta perfecta (Covered Query) y termina el trabajo en milisegundos."], ["Covered Query", "Consulta perfecta: ocurre cuando el índice no agrupado contiene absolutamente todos los datos que la consulta pide, por lo que el motor solo hace un Index Seek, sin abrir la tabla (como ver el glosario y descubrir que era todo lo que necesitabas)."], ["Key Lookup", "Viaje extra del motor a la tabla principal por cada fila encontrada, que ocurre al usar SELECT * o pedir columnas que no están en el índice. Es costoso: el «efecto boomerang» es un destructor silencioso del rendimiento."], ["Columnas INCLUDE", "Permiten adjuntar datos extra (el payload) al nivel inferior, el nivel hoja, del índice sin alterar su orden. Responden a la consulta al instante sin visitar la tabla principal. El motor no las usa para ordenar ni filtrar; a cambio el índice pesa algo más en disco."], ["Clave de índice", "Columna que se usa en WHERE, JOIN, ORDER BY o GROUP BY. Define la estructura y el orden del índice: «las claves de índice construyen el camino»."], ["Regla de oro del diseño de índices", "Dividir el problema en dos preguntas: filtrar la realidad (columnas de WHERE, JOIN, ORDER BY o GROUP BY: clave de índice) y mostrar el resultado (columnas que solo aparecen en el SELECT: INCLUDE). Las claves construyen el camino; las columnas incluidas son el equipaje que llevas al final."], ["Selectividad", "Regla del DBA: crear índices en columnas con valores muy diferentes entre sí (baja densidad). Un índice en una columna de género es inútil; en el DNI es perfecto."], ["Estadísticas", "Información que usa el optimizador de SQL para decidir qué ruta tomar. Si los datos cambian y las estadísticas son viejas, el motor tomará el camino equivocado; por eso hay que mantenerlas actualizadas."], ["SELECT *", "Regla 1 del Senior DBA: pedir todas las columnas destruye los índices cubiertos y fuerza costosos Key Lookups. Hay que pedir solo lo que se necesita."]], "r": [{"t": "1. El problema de buscar a ciegas", "h": "<p>Sin un camino optimizado, el motor lee la tabla <b>fila por fila</b>. En el ejemplo de la presentación lee <b>10,100 filas para devolver solo 1</b>. Se llama <b>Table Scan</b> o <b>Clustered Index Scan</b> y destruye el rendimiento.</p><p>Analogía: leer un libro de 1,000 páginas, línea por línea, solo para encontrar el nombre de un personaje secundario.</p><p><span class=\"extra\">[Extra]</span> Si la tabla no tiene índice agrupado (un <i>heap</i>) se llama Table Scan; si lo tiene, Clustered Index Scan. En ambos casos lee todo.</p>"}, {"t": "2. Qué es un índice", "h": "<p>Un índice no es magia: es una <b>estructura de datos externa</b> (como un <b>árbol B</b>) que permite al optimizador de consultas encontrar filas específicas a gran velocidad, sin escanear toda la tabla.</p><div class=\"regla\">Tú defines qué buscar y el motor decide cómo encontrarlo.</div><p><span class=\"extra\">[Extra]</span> Un árbol B tiene <b>raíz</b>, <b>niveles intermedios</b> y <b>nivel hoja</b>. El motor baja por él en pocos saltos, aunque la tabla tenga millones de filas.</p>"}, {"t": "3. Índice agrupado (Clustered)", "h": "<ul><li>Dicta el <b>orden físico real</b> de los datos en el disco.</li><li>Solo puede existir <b>uno por tabla</b>: los datos no pueden ordenarse físicamente de dos maneras a la vez.</li><li>Ideal para claves primarias y rangos de datos.</li><li>Analogía: un <b>diccionario</b>; las palabras van de la A a la Z y el libro entero ES el índice. En el plan aparece como <i>Clustered Index Seek</i>.</li></ul><pre>-- Extra: ordenar físicamente las ventas por fecha\nCREATE CLUSTERED INDEX CX_Ventas_Fecha ON dbo.Ventas (Fecha);\n\nSELECT * FROM dbo.Ventas\nWHERE Fecha BETWEEN '2025-01-01' AND '2025-01-31';</pre><p><span class=\"extra\">[Extra]</span> En SQL Server la clave primaria crea un índice agrupado por defecto, salvo que indiques <code>NONCLUSTERED</code>. Crear otro agrupado en esa tabla da error.</p>"}, {"t": "4. Índice no agrupado (Non-Clustered)", "h": "<ul><li>Estructura <b>totalmente separada</b> de los datos reales.</li><li>Contiene la <b>clave ordenada</b> y un <b>puntero</b> a la fila exacta.</li><li>Puede haber <b>múltiples por tabla</b>, para diferentes tipos de búsquedas.</li><li>Analogía: el <b>glosario al final de un libro</b>; está ordenado alfabéticamente pero no trae la explicación, solo el número de página.</li></ul>"}, {"t": "5. Agrupado vs no agrupado", "h": "<table><tr><th></th><th>Agrupado (Clustered)</th><th>No agrupado (Non-Clustered)</th></tr><tr><td>Analogía</td><td>Diccionario</td><td>Glosario al final del libro</td></tr><tr><td>Orden físico</td><td>Ordena físicamente los datos reales en el disco</td><td>Estructura lógica totalmente separada</td></tr><tr><td>Límite por tabla</td><td>Solo 1 absoluto</td><td>Múltiples permitidos</td></tr><tr><td>Operación ideal</td><td>Filas enteras o rangos grandes</td><td>Búsquedas hiper-específicas de columnas concretas</td></tr></table>"}, {"t": "6. La consulta perfecta (Covered Query)", "h": "<p>Ocurre cuando el índice no agrupado contiene <b>absolutamente todas las columnas</b> que pide la consulta.</p><p>El motor hace un simple <b>Index Seek</b> y termina en milisegundos.</p><p>Analogía: miras el glosario y descubres que eso era todo lo que necesitabas; no tienes que abrir el libro.</p>"}, {"t": "7. La trampa: Key Lookup (efecto boomerang)", "h": "<p>Pasa cuando usas <code>SELECT *</code> o pides columnas que <b>no están en el índice</b>.</p><p>El índice encuentra la fila, pero como faltan datos, el motor hace <b>un viaje extra a la tabla principal por cada fila</b>. Con 1,000 filas son 1,000 viajes: un destructor silencioso del rendimiento.</p><p>Analogía: encuentras el tema en el glosario, pero debes caminar al otro lado de la biblioteca a buscar el libro; hacerlo 1,000 veces te colapsa.</p><p><span class=\"extra\">[Extra]</span> Si la tabla es un heap, el viaje extra se llama <i>RID Lookup</i>.</p>"}, {"t": "8. La solución: columnas INCLUDE", "h": "<p>¿Cómo eliminar el viaje extra sin alterar el orden del índice? Con <b>INCLUDE</b>: adjuntan datos extra (el <i>payload</i>, que «viaja gratis») al <b>nivel inferior</b> del índice y responden a la consulta al instante sin visitar la tabla principal.</p><p>Analogía: el glosario, además del número de página, trae un resumen de una línea del concepto.</p><pre>-- Solo clave: Index Seek + un Key Lookup por cada fila\nCREATE NONCLUSTERED INDEX IX_Customers_Country\nON dbo.Customers (Country);\n\n-- Con INCLUDE: índice cubierto, solo Index Seek\nCREATE NONCLUSTERED INDEX IX_Customers_Country\nON dbo.Customers (Country)\nINCLUDE (Name, Email);</pre>"}, {"t": "9. Anatomía de la columna incluida", "h": "<p>El motor <b>no usa las columnas INCLUDE para ordenar ni filtrar</b>: las añade <b>exclusivamente en el nivel hoja</b> del árbol B. Resultado: el índice pesa algo más en disco, pero se ejecuta mucho más rápido (Covered Query) sin romper la estructura de búsqueda principal.</p><svg viewBox=\"0 0 540 190\" role=\"img\" aria-label=\"Árbol B con columnas incluidas solo en las hojas\"><line x1=\"257\" y1=\"42\" x2=\"133\" y2=\"62\" stroke=\"#3d5a99\"/><line x1=\"257\" y1=\"42\" x2=\"381\" y2=\"62\" stroke=\"#3d5a99\"/><line x1=\"133\" y1=\"82\" x2=\"71\" y2=\"102\" stroke=\"#3d5a99\"/><line x1=\"133\" y1=\"82\" x2=\"195\" y2=\"102\" stroke=\"#3d5a99\"/><line x1=\"381\" y1=\"82\" x2=\"319\" y2=\"102\" stroke=\"#3d5a99\"/><line x1=\"381\" y1=\"82\" x2=\"443\" y2=\"102\" stroke=\"#3d5a99\"/><line x1=\"71\" y1=\"122\" x2=\"40\" y2=\"150\" stroke=\"#3d5a99\"/><line x1=\"71\" y1=\"122\" x2=\"102\" y2=\"150\" stroke=\"#3d5a99\"/><line x1=\"195\" y1=\"122\" x2=\"164\" y2=\"150\" stroke=\"#3d5a99\"/><line x1=\"195\" y1=\"122\" x2=\"226\" y2=\"150\" stroke=\"#3d5a99\"/><line x1=\"319\" y1=\"122\" x2=\"288\" y2=\"150\" stroke=\"#3d5a99\"/><line x1=\"319\" y1=\"122\" x2=\"350\" y2=\"150\" stroke=\"#3d5a99\"/><line x1=\"443\" y1=\"122\" x2=\"412\" y2=\"150\" stroke=\"#3d5a99\"/><line x1=\"443\" y1=\"122\" x2=\"474\" y2=\"150\" stroke=\"#3d5a99\"/><polygon points=\"244,42 270,42 257,22\" fill=\"#6f8fc7\" stroke=\"#3d5a99\"/><polygon points=\"120,82 146,82 133,62\" fill=\"#6f8fc7\" stroke=\"#3d5a99\"/><polygon points=\"368,82 394,82 381,62\" fill=\"#6f8fc7\" stroke=\"#3d5a99\"/><polygon points=\"58,122 84,122 71,102\" fill=\"#6f8fc7\" stroke=\"#3d5a99\"/><polygon points=\"182,122 208,122 195,102\" fill=\"#6f8fc7\" stroke=\"#3d5a99\"/><polygon points=\"306,122 332,122 319,102\" fill=\"#6f8fc7\" stroke=\"#3d5a99\"/><polygon points=\"430,122 456,122 443,102\" fill=\"#6f8fc7\" stroke=\"#3d5a99\"/><rect x=\"16\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"20\" y=\"166\" font-size=\"9\">clave</text><rect x=\"32\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"35\" y=\"176\" font-size=\"8\">Incluidos</text><line x1=\"62\" y1=\"163\" x2=\"78\" y2=\"163\" stroke=\"#3d5a99\"/><rect x=\"78\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"82\" y=\"166\" font-size=\"9\">clave</text><rect x=\"94\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"97\" y=\"176\" font-size=\"8\">Incluidos</text><line x1=\"124\" y1=\"163\" x2=\"140\" y2=\"163\" stroke=\"#3d5a99\"/><rect x=\"140\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"144\" y=\"166\" font-size=\"9\">clave</text><rect x=\"156\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"159\" y=\"176\" font-size=\"8\">Incluidos</text><line x1=\"186\" y1=\"163\" x2=\"202\" y2=\"163\" stroke=\"#3d5a99\"/><rect x=\"202\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"206\" y=\"166\" font-size=\"9\">clave</text><rect x=\"218\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"221\" y=\"176\" font-size=\"8\">Incluidos</text><line x1=\"248\" y1=\"163\" x2=\"264\" y2=\"163\" stroke=\"#3d5a99\"/><rect x=\"264\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"268\" y=\"166\" font-size=\"9\">clave</text><rect x=\"280\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"283\" y=\"176\" font-size=\"8\">Incluidos</text><line x1=\"310\" y1=\"163\" x2=\"326\" y2=\"163\" stroke=\"#3d5a99\"/><rect x=\"326\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"330\" y=\"166\" font-size=\"9\">clave</text><rect x=\"342\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"345\" y=\"176\" font-size=\"8\">Incluidos</text><line x1=\"372\" y1=\"163\" x2=\"388\" y2=\"163\" stroke=\"#3d5a99\"/><rect x=\"388\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"392\" y=\"166\" font-size=\"9\">clave</text><rect x=\"404\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"407\" y=\"176\" font-size=\"8\">Incluidos</text><line x1=\"434\" y1=\"163\" x2=\"450\" y2=\"163\" stroke=\"#3d5a99\"/><rect x=\"450\" y=\"150\" width=\"46\" height=\"26\" fill=\"#c9d8f5\" stroke=\"#3d5a99\"/><text x=\"454\" y=\"166\" font-size=\"9\">clave</text><rect x=\"466\" y=\"164\" width=\"40\" height=\"18\" fill=\"#f5c542\" stroke=\"#b8860b\"/><text x=\"469\" y=\"176\" font-size=\"8\">Incluidos</text><text x=\"4\" y=\"14\" font-size=\"10\" fill=\"#5b6477\">Raíz</text><text x=\"4\" y=\"78\" font-size=\"10\" fill=\"#5b6477\">Intermedios</text><text x=\"4\" y=\"144\" font-size=\"10\" fill=\"#5b6477\">Hojas</text></svg><ul><li><b>Raíz y nodos intermedios:</b> solo guardan valores de la clave y deciden hacia dónde seguir.</li><li><b>Nivel hoja:</b> la clave con su puntero y, pegados, los «Datos incluidos».</li></ul><pre>-- Seek: Country es clave\nSELECT Name, Email FROM dbo.Customers WHERE Country = 'Spain';\n-- Sin Seek: Email solo está en las hojas, sin orden\nSELECT Name FROM dbo.Customers WHERE Email = 'ana@mail.com';</pre><p><b>Qué ganas:</b> consultas cubiertas, solo Index Seek, sin Key Lookup. <b>Qué pagas:</b> espacio (las columnas incluidas se copian dentro del índice).</p><p><span class=\"extra\">[Extra]</span> Las hojas están enlazadas en el orden de la clave: en un rango, el motor encuentra la primera hoja y sigue por los enlaces. También pagas en escrituras: actualizar una columna incluida actualiza su copia; incluye solo las que el SELECT pide.</p>"}, {"t": "10. Clave vs INCLUDE", "h": "<table><tr><th></th><th>Columna clave</th><th>Columna INCLUDE</th></tr><tr><td>Dónde se guarda</td><td>En todos los niveles del árbol</td><td>Solo en el nivel hoja</td></tr><tr><td>Sirve para filtrar y ordenar</td><td>Sí (WHERE, JOIN, ORDER BY, GROUP BY)</td><td>No</td></tr><tr><td>Afecta el orden del índice</td><td>Sí</td><td>No</td></tr><tr><td>Para qué se usa</td><td>Construir el camino</td><td>Llevar el «equipaje» al final</td></tr></table><div class=\"nota\"><span class=\"extra\">[Extra]</span> <b>Error común:</b> hacer todo clave, por ejemplo <code>(Country, Name, Email)</code>. También cubre la consulta, pero mete Name y Email en todos los niveles y el árbol queda más pesado.</div>"}, {"t": "11. Regla de oro y árbol de decisión", "h": "<p>Para no adivinar, los DBAs senior se hacen dos preguntas: <b>filtrar la realidad</b> y <b>mostrar el resultado</b>.</p><div class=\"regla\">Las claves de índice construyen el camino. Las columnas incluidas son el equipaje que llevas al final del camino.</div><table><tr><th>¿Cómo interactúa la columna con tu consulta?</th><th>Decisión</th></tr><tr><td>Se usa en WHERE, JOIN, ORDER BY o GROUP BY</td><td>Clave de índice (define la estructura y el orden)</td></tr><tr><td>Solo aparece en el SELECT para mostrarse</td><td>Columna INCLUDE (viaja gratis sin afectar el orden)</td></tr></table><pre>SELECT Name, Email        -- solo se muestran      -> INCLUDE\nFROM Customers\nWHERE Country = 'Spain';  -- filtra filas           -> clave\n\nCREATE NONCLUSTERED INDEX IX_Customers_Country\nON Customers (Country)    -- clave\nINCLUDE (Name, Email);    -- equipaje</pre>"}, {"t": "12. Las reglas del Senior DBA", "h": "<ol><li><b>Huye del SELECT *.</b> Pedir todas las columnas destruye los índices cubiertos y fuerza costosos Key Lookups. Pide solo lo que necesitas.</li><li><b>Busca la selectividad.</b> Indexa columnas con valores muy diferentes entre sí (baja densidad). Un índice en una columna de género es inútil; en el DNI es perfecto.</li><li><b>Actualiza las estadísticas.</b> El optimizador decide la ruta basándose en estadísticas; si los datos cambian y están viejas, tomará el camino equivocado.</li></ol><pre>-- Extra: refrescar estadísticas\nUPDATE STATISTICS dbo.Customers;</pre>"}, {"t": "13. Extras: índice compuesto y plan de ejecución", "h": "<p><span class=\"extra\">[Extra]</span> <b>El orden de las columnas clave importa:</b></p><pre>CREATE NONCLUSTERED INDEX IX_Cust_Country_City\nON dbo.Customers (Country, City);\n\nWHERE Country = 'Spain' AND City = 'Madrid'  -- Seek\nWHERE Country = 'Spain'                       -- también Seek\nWHERE City = 'Madrid'                         -- normalmente no hace Seek eficiente</pre><p><span class=\"extra\">[Extra]</span> <b>Cómo verificar Seek o Scan:</b> en SSMS activa <i>Include Actual Execution Plan</i> con <b>Ctrl+M</b> y ejecuta la consulta; verás Index Seek, Index Scan o Key Lookup. También <code>SET STATISTICS IO ON;</code> muestra las lecturas.</p>"}, {"t": "14. Resumen para repasar", "h": "<ul><li>Sin índice: <b>Scan</b> (lee todo). Con índice: <b>Seek</b> (va directo).</li><li><b>Agrupado:</b> orden físico, solo 1 por tabla, ideal para PK y rangos. <b>No agrupado:</b> estructura separada con clave + puntero, varios por tabla.</li><li><b>Covered Query:</b> el índice trae todo lo que pide la consulta. <b>Key Lookup:</b> viaje extra a la tabla por cada fila cuando falta una columna.</li><li><b>INCLUDE:</b> columnas solo en el nivel hoja; no filtran ni ordenan; eliminan el Key Lookup.</li><li><b>Clave</b> = WHERE, JOIN, ORDER BY, GROUP BY. <b>INCLUDE</b> = solo SELECT.</li><li>Reglas del DBA: no uses SELECT *, indexa columnas selectivas y mantén las estadísticas al día.</li></ul>"}, {"t": "Ejemplo de código · Índice no agrupado simple", "h": "<p><b>Enunciado:</b> Crea un índice no agrupado llamado IX_Customers_Country sobre la columna Country de la tabla Customers.</p><p><b>Solución:</b></p><pre>-- crear el índice no agrupado\nCREATE NONCLUSTERED INDEX IX_Customers_Country ON Customers (Country);</pre>"}, {"t": "Ejemplo de código · Convertir la consulta en cubierta", "h": "<p><b>Enunciado:</b> La consulta SELECT Name, Email FROM Customers WHERE Country = 'Spain'; provoca Key Lookups. Crea el índice no agrupado IX_Customers_Country de modo que la cubra: la columna del WHERE como clave y las columnas del SELECT como INCLUDE.</p><p><b>Solución:</b></p><pre>-- índice con clave Country e INCLUDE de Name y Email\nCREATE NONCLUSTERED INDEX IX_Customers_Country ON Customers (Country) INCLUDE (Name, Email);</pre>"}, {"t": "Ejemplo de código <span class=\"extra\">[Extra]</span> · Índice agrupado por fecha", "h": "<p><span class=\"extra\">[Extra]</span> Este ejemplo no viene en las diapositivas; lo agregué yo.</p><p><b>Enunciado:</b> Ordena físicamente la tabla dbo.Ventas por la columna Fecha creando el índice agrupado CX_Ventas_Fecha.</p><p><b>Solución:</b></p><pre>-- crear el índice agrupado\nCREATE CLUSTERED INDEX CX_Ventas_Fecha ON dbo.Ventas (Fecha);</pre>"}, {"t": "Ejemplo de código <span class=\"extra\">[Extra]</span> · Claves y INCLUDE en un mismo índice", "h": "<p><span class=\"extra\">[Extra]</span> Este ejemplo no viene en las diapositivas; lo agregué yo.</p><p><b>Enunciado:</b> Consulta: SELECT Nombre, Total FROM dbo.Pedidos WHERE IdCliente = 7 ORDER BY Fecha; Crea el índice no agrupado IX_Pedidos_Cliente_Fecha que la cubra: como claves las columnas del WHERE y del ORDER BY (en ese orden) y como INCLUDE las del SELECT.</p><p><b>Solución:</b></p><pre>-- índice con claves IdCliente, Fecha e INCLUDE de Nombre y Total\nCREATE NONCLUSTERED INDEX IX_Pedidos_Cliente_Fecha ON dbo.Pedidos (IdCliente, Fecha) INCLUDE (Nombre, Total);</pre>"}, {"t": "Ejemplo de código · Evitar el SELECT *", "h": "<p><b>Enunciado:</b> Reescribe SELECT * FROM Customers WHERE Country = 'Spain'; para que pida solo el nombre y el correo.</p><p><b>Solución:</b></p><pre>-- pedir solo Name y Email\nSELECT Name, Email FROM Customers WHERE Country = 'Spain';</pre>"}, {"t": "Ejemplo de código <span class=\"extra\">[Extra]</span> · Actualizar estadísticas", "h": "<p><span class=\"extra\">[Extra]</span> Este ejemplo no viene en las diapositivas; lo agregué yo.</p><p><b>Enunciado:</b> El optimizador está eligiendo malas rutas porque los datos de dbo.Customers cambiaron mucho. Actualiza las estadísticas de esa tabla.</p><p><b>Solución:</b></p><pre>-- actualizar las estadísticas de la tabla\nUPDATE STATISTICS dbo.Customers;</pre>"}]}, {"n": "Gestión de índices (crear, mantener, monitorear)", "c": [["Índice", "Estructura auxiliar que mejora la velocidad de acceso a los datos de una tabla, de forma similar a cómo el índice de un libro facilita localizar un tema sin leer todas las páginas. Almacena claves de búsqueda y apuntadores a las filas correspondientes en la tabla."], ["Índice clustered", "Ordena físicamente las filas de la tabla según el índice, por eso solo puede haber uno por tabla. En SQL Server se crea por defecto cuando se declara una PRIMARY KEY."], ["Índice nonclustered", "Mantiene una copia del campo indexado con un puntero a la fila de la tabla. Puede haber varios por tabla."], ["Índice unique", "Garantiza que no se repitan valores en la columna indexada; funciona de forma similar a una restricción de unicidad."], ["Índice filtered", "Aplica el índice solo a una parte de la tabla (por ejemplo, solo los clientes activos), mediante una condición WHERE al crearlo."], ["Ventajas de los índices", "Aceleran la recuperación de datos en consultas SELECT, mejoran el rendimiento de las cláusulas WHERE, ORDER BY, GROUP BY y JOIN, y ayudan a garantizar la unicidad en columnas clave."], ["Desventajas de los índices", "Uso de espacio en disco (almacenamiento adicional), problemas de fragmentación por falta de mantenimiento y ralentización de las operaciones DML (INSERT, UPDATE, DELETE), porque hay que actualizar los índices."], ["Fragmentación", "Desorden que sufren los índices por muchos INSERT, UPDATE y DELETE; obliga al DBA a darles mantenimiento. Se consulta con avg_fragmentation_in_percent."], ["REORGANIZE", "Opción de ALTER INDEX que se aplica en el plan de mantenimiento cuando la fragmentación es menor a 30 %."], ["REBUILD", "Opción de ALTER INDEX que se aplica en el plan de mantenimiento cuando la fragmentación es mayor a 30 %; reconstruye el índice."], ["DROP INDEX", "Comando que elimina un índice de una tabla; se indica el nombre del índice y la tabla (… ON Clientes)."], ["Cuándo crear un índice", "Cuando una columna se usa con frecuencia en WHERE, JOIN, ORDER BY, GROUP BY o PARTITION BY; en tablas grandes con muchos registros; y cuando se necesitan consultas rápidas sobre campos clave (por ejemplo, correo electrónico o número de documento)."], ["Cuándo no conviene indexar", "En tablas muy pequeñas (el motor lee toda la tabla más rápido), en columnas que cambian con mucha frecuencia (muchos UPDATE o DELETE), en columnas con muy poca selectividad y cuando ya existen índices redundantes sobre las mismas columnas."], ["Poca selectividad", "Característica de una columna con muy pocos valores distintos, como el campo Sexo con solo «M» y «F»; indexarla casi no ayuda."], ["Índices redundantes", "Índices que ya existen sobre las mismas columnas; es una de las situaciones en que no conviene crear otro índice."], ["Número óptimo de índices", "No existe un número exacto: depende de la carga de consultas. Generalmente 1 clustered (obligatorio elegirlo bien) y varios nonclustered, evitando el exceso porque cada uno ocupa espacio y afecta el rendimiento en DML. Regla práctica: crear índices que beneficien las consultas más costosas o más frecuentes."], ["Plan de ejecución", "Herramienta de SQL Server que se usa para identificar si un índice está siendo utilizado."], ["sys.dm_db_missing_index_details", "Vista del catálogo de SQL Server que muestra los índices que el optimizador sugiere crear."], ["sys.dm_db_index_physical_stats", "Función de SQL Server que, unida con sys.indexes, permite consultar la fragmentación de los índices (en el ejemplo, en modo 'LIMITED')."], ["BULK INSERT", "Comando que carga datos masivamente desde un archivo (por ejemplo, un CSV), con opciones como FIELDTERMINATOR, ROWTERMINATOR, FIRSTROW (2 si el archivo tiene encabezado) y CODEPAGE (65001 para UTF-8)."]], "r": [{"t": "1. Objetivo y qué es un índice", "h": "<p><b>Objetivo:</b> implementar índices para acelerar las consultas (pasar de consultas lentas a consultas rápidas).</p><p>Un índice es una <b>estructura auxiliar</b> que mejora la velocidad de acceso a los datos de una tabla, como el índice de un libro que te permite localizar un tema sin leer todas las páginas.</p><p>Almacena <b>claves de búsqueda</b> y <b>apuntadores</b> a las filas correspondientes de la tabla.</p><p><span class=\"extra\">[Extra]</span> Auxiliar significa que la tabla existe sin él: es una copia organizada de ciertas columnas que el motor mantiene sincronizada. Si lo borras, no pierdes datos, solo velocidad.</p>"}, {"t": "2. Clustered y nonclustered", "h": "<p><b>Clustered (agrupado):</b> ordena <b>físicamente las filas</b> de la tabla según el índice; solo <b>uno por tabla</b>. Una PRIMARY KEY lo crea por defecto.</p><pre>CREATE TABLE Empleados (\n    ID INT PRIMARY KEY,         -- índice clustered por defecto\n    Nombre NVARCHAR(100),\n    Departamento NVARCHAR(50)\n);</pre><p><b>Nonclustered (no agrupado):</b> mantiene una <b>copia del campo indexado con un puntero</b> a la fila; puede haber <b>varios</b>.</p><pre>CREATE TABLE Empleados (\n    ID INT, Nombre NVARCHAR(100), Departamento NVARCHAR(50),\n    CONSTRAINT PK_Empleados PRIMARY KEY NONCLUSTERED (ID)\n);\n-- Ahora se puede ordenar físicamente por Departamento\nCREATE CLUSTERED INDEX IX_ED ON Empleados(Departamento);</pre><table><tr><th></th><th>Clustered</th><th>Nonclustered</th></tr><tr><td>Orden de las filas</td><td>Ordena físicamente la tabla</td><td>No cambia el orden de la tabla</td></tr><tr><td>Cuántos</td><td>Solo 1</td><td>Varios</td></tr><tr><td>Qué guarda</td><td>Los datos mismos, ordenados</td><td>Copia de la columna + puntero</td></tr></table><p><span class=\"extra\">[Extra]</span> Si dejas la PK como clustered e intentas crear otro clustered, da error: los datos no pueden ordenarse de dos maneras a la vez. Por eso se declara la PK como NONCLUSTERED.</p>"}, {"t": "3. Ventajas y desventajas", "h": "<p><b>Ventajas</b></p><ul><li><b>Recuperación de datos:</b> aceleran las consultas SELECT.</li><li><b>Mejora del rendimiento:</b> aceleran WHERE, ORDER BY, GROUP BY y JOIN.</li><li><b>Garantizar la unicidad</b> en columnas clave.</li></ul><p><b>Desventajas</b> (diagrama de espina de pescado)</p><table><tr><th>Causa</th><th>Significa</th></tr><tr><td>Uso de espacio en disco</td><td>Almacenamiento adicional y costos de almacenamiento</td></tr><tr><td>Problemas de fragmentación</td><td>Falta de mantenimiento y fragmentación de datos</td></tr><tr><td>Ralentización de operaciones</td><td>Actualizaciones de índices; impacto en operaciones DML</td></tr></table><p><span class=\"extra\">[Extra]</span> Con 5 índices nonclustered, un solo INSERT escribe la fila en la tabla y una entrada en cada uno de los 5 índices. El SELECT se acelera, pero las escrituras cuestan más.</p>"}, {"t": "4. Sintaxis básica y tipos", "h": "<pre>CREATE [UNIQUE] [CLUSTERED | NONCLUSTERED] INDEX nombre_indice\nON nombre_tabla (columna1 [ASC|DESC], ... columnaN);</pre><table><tr><th>Tipo</th><th>Qué hace</th><th>Ejemplo</th></tr><tr><td>Clustered</td><td>Ordena físicamente los datos; solo uno por tabla</td><td><code>CREATE CLUSTERED INDEX idx_cliente_id ON Clientes(IdCliente);</code></td></tr><tr><td>Non-clustered</td><td>Copia de la columna con punteros a las filas; muchos por tabla</td><td><code>CREATE NONCLUSTERED INDEX idx_cliente_nombre ON Clientes(Nombre);</code></td></tr><tr><td>Unique</td><td>No permite valores repetidos; similar a una restricción UNIQUE</td><td><code>CREATE UNIQUE INDEX idx_cliente_email ON Clientes(Email);</code></td></tr><tr><td>Filtered</td><td>Índice sobre una parte de la tabla (ej. solo clientes activos)</td><td><code>CREATE INDEX idx_cliente_activo ON Clientes(Estado) WHERE Estado = 'Activo';</code></td></tr></table><p><span class=\"extra\">[Extra]</span> <b>Más ejemplos:</b></p><pre>-- Compuesto, con orden descendente en la 2.ª columna\nCREATE NONCLUSTERED INDEX IX_Clientes_Ciudad_Fecha\nON Clientes (Ciudad ASC, FechaRegistro DESC);\n\n-- Filtered: solo los clientes inactivos (índice más pequeño)\nCREATE NONCLUSTERED INDEX IX_Clientes_Inactivos\nON Clientes (FechaRegistro) WHERE Estado = 'Inactivo';</pre><p><span class=\"extra\">[Extra]</span> Un índice UNIQUE rechaza duplicados al insertar y no se puede crear si la columna ya tiene valores repetidos.</p>"}, {"t": "5. Eliminar y mantener índices", "h": "<pre>-- Eliminación de un índice\nDROP INDEX idx_cliente_nombre ON Clientes;\n\n-- Mantenimiento cuando el índice se fragmenta\nALTER INDEX idx_cliente_nombre ON Clientes REORGANIZE;\nALTER INDEX idx_cliente_nombre ON Clientes REBUILD;</pre><p>Cuando los índices se <b>fragmentan</b> por muchos INSERT/UPDATE/DELETE, el DBA debe darles mantenimiento.</p><table><tr><th>Fragmentación</th><th>Acción</th></tr><tr><td>Menor a 30 %</td><td>REORGANIZE</td></tr><tr><td>Mayor a 30 %</td><td>REBUILD</td></tr></table><p><span class=\"extra\">[Extra]</span> REORGANIZE es liviano: reordena las páginas hoja del índice existente. REBUILD lo borra y lo vuelve a crear por completo. Para todos los índices de la tabla: <code>ALTER INDEX ALL ON Clientes REBUILD;</code></p>"}, {"t": "6. ¿Cuándo crear un índice y cuándo no?", "h": "<p><b>Conviene crearlo cuando</b></p><ul><li>La columna se usa con frecuencia en <b>WHERE</b>, <b>JOIN</b>, <b>ORDER BY</b>, <b>GROUP BY</b> o <b>PARTITION BY</b>.</li><li>La tabla es grande, con muchos registros.</li><li>Se necesitan consultas rápidas sobre campos clave (correo electrónico, número de documento).</li></ul><p><b>No conviene indexar cuando</b></p><ul><li>Son <b>tablas muy pequeñas</b>: el motor lee toda la tabla más rápido que usando un índice.</li><li>Son columnas que <b>cambian con mucha frecuencia</b> (muchos UPDATE o DELETE).</li><li>Tienen <b>muy poca selectividad</b> (campo Sexo con solo «M» y «F»).</li><li>Ya existen <b>índices redundantes</b> sobre las mismas columnas.</li></ul><p><span class=\"extra\">[Extra]</span> Si ya existe un índice en <code>(Apellido, Nombre)</code>, otro solo en <code>(Apellido)</code> sobra: el compuesto ya sirve para buscar por Apellido.</p>"}, {"t": "7. Número óptimo de índices", "h": "<p><b>No existe un número exacto:</b> depende de la carga de consultas. Generalmente:</p><ul><li><b>1 índice clustered</b> (es obligatorio elegirlo bien).</li><li><b>Varios nonclustered</b>, evitando el exceso: cada uno ocupa espacio y afecta el rendimiento en DML.</li></ul><div class=\"regla\">Regla práctica: crear índices que beneficien las consultas más costosas o más frecuentes.</div>"}, {"t": "8. Monitoreo del rendimiento", "h": "<ul><li>Usar el <b>plan de ejecución</b> de SQL Server para identificar si un índice está siendo utilizado.</li><li>Consultar vistas del catálogo, por ejemplo los índices que el optimizador sugiere:</li></ul><pre>SELECT * FROM sys.dm_db_missing_index_details;</pre><p><b>Consulta de fragmentación:</b></p><pre>SELECT\n   OBJECT_NAME(ips.object_id) AS Tabla,\n   i.name AS Indice,\n   ips.index_type_desc AS Tipo,\n   ips.avg_fragmentation_in_percent AS Fragmentacion\nFROM sys.dm_db_index_physical_stats(DB_ID(), NULL, NULL, NULL, 'LIMITED') AS ips\nJOIN sys.indexes AS i\n  ON ips.object_id = i.object_id AND ips.index_id = i.index_id\nWHERE ips.database_id = DB_ID();</pre><p>Con el resultado se aplica el plan de mantenimiento: menor a 30 % <b>REORGANIZE</b>, mayor a 30 % <b>REBUILD</b>.</p><p><span class=\"extra\">[Extra]</span> <b>Detectar índices que no se usan:</b> muchos <code>user_updates</code> y casi ningún seek/scan/lookup = índice que solo estorba.</p><pre>SELECT OBJECT_NAME(s.object_id) AS Tabla, i.name AS Indice,\n       s.user_seeks, s.user_scans, s.user_lookups, s.user_updates\nFROM sys.dm_db_index_usage_stats AS s\nJOIN sys.indexes AS i ON s.object_id = i.object_id AND s.index_id = i.index_id\nWHERE s.database_id = DB_ID();</pre>"}, {"t": "9. Laboratorio (pasos 1 a 3)", "h": "<p><b>Paso 1. Crear la tabla</b> con la PK NONCLUSTERED:</p><pre>USE indicesLab;\nCREATE TABLE Clientes (\n   IdCliente INT IDENTITY(1,1),\n   Nombre NVARCHAR(50), Apellido NVARCHAR(50), Email NVARCHAR(100),\n   Ciudad NVARCHAR(50), Estado NVARCHAR(20), FechaRegistro DATE,\n   CONSTRAINT PK_Clientes PRIMARY KEY NONCLUSTERED (IdCliente)\n);</pre><p><span class=\"extra\">[Extra]</span> En la diapositiva falta una coma después de <code>FechaRegistro DATE</code>; sin ella da error de sintaxis.</p><p><b>Paso 2.</b> Crear el clustered por Apellido (posible porque la PK es nonclustered) y consultar la fragmentación:</p><pre>CREATE CLUSTERED INDEX IX_Clientes_Apellido ON Clientes(Apellido);</pre><p><b>Paso 3.</b> Cargar datos masivamente desde un CSV y contar filas:</p><pre>BULK INSERT Clientes\nFROM 'C:\\bulk_data\\Clientes.csv'\nWITH (\n   FIELDTERMINATOR = ';',   -- separador de campos\n   ROWTERMINATOR = '\\n',    -- separador de filas\n   FIRSTROW = 2,            -- salta el encabezado\n   CODEPAGE = '65001'       -- UTF-8\n);\nSELECT COUNT(*) FROM Clientes;</pre><p><span class=\"extra\">[Extra]</span> En la diapositiva la ruta termina con una comilla curva (’); debe ser recta ('). Un clustered por Apellido se fragmenta al cargar muchos datos: por eso se revisa después.</p>"}, {"t": "10. Laboratorio (pasos 4 y 5)", "h": "<p><b>Paso 4. Medir el efecto de un índice</b> (antes y después):</p><pre>SET STATISTICS TIME ON;\n\nSELECT * FROM Clientes\nWHERE FechaRegistro BETWEEN '2011-01-01' AND '2012-03-31';\n\nCREATE INDEX IX_Clientes_Fecha ON Clientes(FechaRegistro);\n\nSELECT * FROM sys.dm_db_missing_index_details;</pre><p><span class=\"extra\">[Extra]</span> Compara CPU time y elapsed time antes y después. Con <code>SELECT *</code> y un rango muy grande, el optimizador puede preferir seguir escaneando la tabla; con un rango corto sí usa el índice.</p><p><b>Paso 5. Más índices y mantenimiento:</b></p><pre>CREATE UNIQUE INDEX IX_Cliente_Email ON Clientes(Email);\nCREATE INDEX IX_Cliente_Ciudad ON Clientes(Ciudad, Estado);\nDROP INDEX IX_Cliente_Ciudad ON Clientes;\nALTER INDEX IX_Clientes_Apellido ON Clientes REBUILD;</pre><p><span class=\"extra\">[Extra]</span> El UNIQUE sobre Email falla si el CSV tiene correos repetidos. En <code>(Ciudad, Estado)</code> el orden importa: sirve para buscar por Ciudad, o por Ciudad y Estado, pero no es eficiente solo por Estado.</p>"}, {"t": "11. Conclusión y resumen", "h": "<div class=\"regla\">Documenta tus índices.</div><p>Un índice bien diseñado es una herramienta poderosa para mejorar el rendimiento, pero un exceso o mal uso puede convertirse en el principal enemigo de la base de datos.</p><ul><li><b>Clustered:</b> orden físico, solo 1 por tabla. <b>Nonclustered:</b> copia + puntero, varios. <b>Unique:</b> sin repetidos. <b>Filtered:</b> solo una parte de la tabla.</li><li>Ventajas: SELECT más rápido, mejor WHERE/ORDER BY/GROUP BY/JOIN, unicidad. Desventajas: espacio, fragmentación, DML más lento.</li><li>Indexa columnas de WHERE, JOIN, ORDER BY y GROUP BY de tablas grandes; evita tablas pequeñas, columnas que cambian mucho y poca selectividad.</li><li>Fragmentación menor a 30 %: REORGANIZE. Mayor a 30 %: REBUILD.</li><li>Monitorea con el plan de ejecución, <code>sys.dm_db_missing_index_details</code> y la consulta de fragmentación.</li></ul>"}]}];
let CONCEPTOS, REPASO;


const $ = (s) => document.querySelector(s);
const barajar = (l) => [...l].sort(() => Math.random() - 0.5);
const limpiar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const solo = (t) => limpiar(t).replace(/[^a-z0-9]/g, "");
const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* ---------- Memoria ---------- */
let tema = 0, cola, dom, intentos, resuelta = false;
const ME = {}, KS = {};
var terminado = false;
function reiniciar() { cola = barajar(CONCEPTOS.map((_, i) => i)); dom = 0; intentos = 0; }
function distractores(item) {
  const pal = (s) => limpiar(s).split(/[^a-z0-9]+/).filter(Boolean);
  const sim = (a, b) => { const A = pal(a), B = pal(b), x = solo(a), y = solo(b); let i = 0; while (i < x.length && i < y.length && x[i] === y[i]) i++; return A.filter((w) => B.includes(w)).length * 2 + i / 4 + Math.random(); };
  return CONCEPTOS.filter((o) => o !== item).sort((a, b) => sim(item[0], b[0]) - sim(item[0], a[0])).slice(0, 3);
}
function progreso() {
  $("#progreso").textContent = `Dominadas ${dom} de ${CONCEPTOS.length}. Intentos: ${intentos}`;
  $("#avance").style.width = `${(dom / CONCEPTOS.length) * 100}%`;
}
function mostrar() {
  terminado = false; resuelta = false; progreso();
  $("#msg").className = ""; $("#sig").hidden = true; $("#opciones").innerHTML = "";
  if (!cola.length) {
    $("#etq").textContent = TEMAS[tema].n;
    $("#pregunta").textContent = `¡Listo! Dominaste los ${CONCEPTOS.length} conceptos con ${intentos} intentos.`;
    $("#def").hidden = true; $("#sig").textContent = "Empezar de nuevo"; $("#sig").hidden = false; resuelta = true; terminado = true; return;
  }
  const item = CONCEPTOS[cola[0]];
  $("#etq").textContent = TEMAS[tema].n;
  $("#pregunta").textContent = "¿A qué concepto corresponde esta definición?";
  $("#def").hidden = false;
  $("#def").textContent = item[1].replace(new RegExp("(?<![\\p{L}\\p{N}_])" + esc(item[0]) + "(?![\\p{L}\\p{N}_])", "giu"), "____");
  barajar([item, ...distractores(item)]).forEach((o) => {
    const b = document.createElement("button"); b.textContent = o[0]; b.onclick = () => elegir(b, o); $("#opciones").appendChild(b);
  });
  $("#sig").textContent = "Siguiente";
}
function elegir(btn, op) {
  if (resuelta) return;
  const item = CONCEPTOS[cola[0]], ok = op === item; intentos++; resuelta = true;
  [...$("#opciones").children].forEach((b) => { b.disabled = true; if (b.textContent === item[0]) b.classList.add("ok"); });
  const m = $("#msg");
  if (ok) { cola.shift(); dom++; m.className = "ok"; m.textContent = `Correcto: ${item[0]}.\n${item[1]}`; }
  else { btn.classList.add("mal"); cola.push(cola.shift()); m.className = "mal"; m.textContent = `Incorrecto. Era: ${item[0]}.\n${item[1]}\n(esta tarjeta volverá a salir)`; }
  m.style.whiteSpace = "pre-wrap"; progreso(); $("#sig").hidden = false; $("#sig").focus();
}
$("#sig").onclick = () => { if (terminado) reiniciar(); mostrar(); };

/* ---------- Repaso ---------- */
let k = 0;
function repaso() {
  $("#contenido").innerHTML = `<span class="etiqueta">Repaso ${k + 1} de ${REPASO.length}</span><h2>${REPASO[k].t}</h2>${REPASO[k].h}`;
  [...$("#chips").children].forEach((b, i) => b.setAttribute("aria-current", i === k));
  $("#ant").disabled = k === 0; $("#prox").disabled = k === REPASO.length - 1;
  window.scrollTo({ top: 0 });
}
function chips() {
  $("#chips").innerHTML = "";
  REPASO.forEach((_, i) => { const b = document.createElement("button"); b.textContent = i + 1; b.onclick = () => { k = i; repaso(); }; $("#chips").appendChild(b); });
}
$("#ant").onclick = () => { if (k > 0) { k--; repaso(); } };
$("#prox").onclick = () => { if (k < REPASO.length - 1) { k++; repaso(); } };
document.addEventListener("keydown", (e) => { if ($("#rep").hidden) return; if (e.key === "ArrowLeft") $("#ant").click(); if (e.key === "ArrowRight") $("#prox").click(); });

/* ---------- Pestañas ---------- */
function modo(m) {
  $("#mem").hidden = m !== "mem"; $("#rep").hidden = m !== "rep";
  $("#m-mem").setAttribute("aria-selected", m === "mem"); $("#m-rep").setAttribute("aria-selected", m === "rep");
  if (m === "rep") repaso();
}
$("#m-mem").onclick = () => modo("mem"); $("#m-rep").onclick = () => modo("rep");
function cambiarTema(i) {
  if (cola) { ME[tema] = { cola, dom, intentos }; KS[tema] = k; }
  tema = i; CONCEPTOS = TEMAS[i].c; REPASO = TEMAS[i].r;
  const s = ME[i];
  if (s) { cola = s.cola; dom = s.dom; intentos = s.intentos; } else reiniciar();
  k = KS[i] || 0; chips(); mostrar();
  if (!$("#rep").hidden) repaso();
}
TEMAS.forEach((t, i) => { const o = document.createElement("option"); o.value = i; o.textContent = t.n; $("#menu").appendChild(o); });
$("#menu").addEventListener("change", (e) => cambiarTema(Number(e.target.value)));
cambiarTema(0);

/* ---------- Enlace directo: #tema=Privilegios&r=DENY ---------- */
(function(){const h=decodeURIComponent(location.hash.slice(1));if(!h)return;
const p=Object.fromEntries(h.split("&").map(x=>x.split("=")));if(!p.tema)return;
const i=TEMAS.findIndex(t=>limpiar(t.n).startsWith(limpiar(p.tema)));if(i<0)return;
$("#menu").value=i;cambiarTema(i);modo("rep");
if(p.r){const j=REPASO.findIndex(x=>limpiar(x.t).includes(limpiar(p.r)));if(j>=0){k=j;repaso()}}})();
</script>
</body>
